<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cpath d='M9 10l7 13 7-13' fill='none' stroke='%238ef5c5' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>VaaniKit admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Redaction+50:ital,wght@0,400;0,700;1,400&family=Inter+Tight:wght@400..700&family=JetBrains+Mono:wght@400..700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #000000;
    --surface: rgba(8, 12, 10, 0.82);
    --surface-strong: rgba(13, 19, 16, 0.92);
    --border: rgba(190, 255, 222, 0.09);
    --border-strong: rgba(190, 255, 222, 0.18);
    --text: #edf5f0;
    --muted: #92a49b;
    --faint: #61716a;
    --accent: #8ef5c5;
    --accent-dim: #5ac899;
    --accent-soft: rgba(142, 245, 197, 0.12);
    --ok: #7ef0b4;
    --warn: #f2c66d;
    --error: #ff8d80;
    --chip: rgba(255, 255, 255, 0.04);
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --sans: "Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --display: "Redaction 50", "Inter Tight", "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html { background: var(--bg); }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.55 var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection { background: rgba(142, 245, 197, 0.26); color: #ffffff; }
  * { scrollbar-width: thin; scrollbar-color: rgba(142, 245, 197, 0.24) transparent; }

  .asciify-host {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
    isolation: isolate;
    background: #000000;
  }

  .asciify-fallback {
    position: absolute;
    inset: 0;
    z-index: -2;
    background-image: radial-gradient(circle, rgba(143, 141, 134, 0.34) 0.65px, transparent 0.9px);
    background-size: 10px 10px;
    opacity: 0.5;
    -webkit-mask-image: radial-gradient(75% 58% at 50% 38%, #000 8%, rgba(0, 0, 0, 0.5) 54%, transparent 78%);
    mask-image: radial-gradient(75% 58% at 50% 38%, #000 8%, rgba(0, 0, 0, 0.5) 54%, transparent 78%);
    transition: opacity 0.35s ease;
  }

  .asciify-host[data-asciify-state="ready"] .asciify-fallback { opacity: 0; }

  .veil {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background:
      radial-gradient(80% 45% at 72% -8%, rgba(142, 245, 197, 0.10), transparent 62%),
      radial-gradient(100% 70% at 50% 110%, rgba(142, 245, 197, 0.05), transparent 60%),
      linear-gradient(180deg, rgba(0, 0, 0, 0.18) 0%, rgba(0, 0, 0, 0.34) 45%, rgba(0, 0, 0, 0.72) 100%);
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px clamp(16px, 4vw, 32px);
    background: rgba(0, 0, 0, 0.62);
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(18px) saturate(140%);
  }

  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }

  .mark {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border-radius: 9px;
    border: 1px solid rgba(142, 245, 197, 0.34);
    background: linear-gradient(145deg, rgba(142, 245, 197, 0.16), rgba(142, 245, 197, 0.02));
    color: var(--accent);
    font: 600 16px/1 var(--mono);
    box-shadow: 0 0 24px rgba(142, 245, 197, 0.14), inset 0 1px 0 rgba(255, 255, 255, 0.12);
  }

  .brand-text { font: 400 19px/1 var(--display); letter-spacing: -0.005em; }

  .pill {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font: 600 10.5px/1 var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--warn);
    background: rgba(242, 198, 109, 0.07);
    border: 1px solid rgba(242, 198, 109, 0.22);
    border-radius: 999px;
    padding: 7px 11px;
    white-space: nowrap;
  }

  .pill .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    box-shadow: 0 0 10px currentColor;
  }

  .wrap {
    position: relative;
    z-index: 2;
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(26px, 5vh, 48px) clamp(16px, 4vw, 32px) 72px;
  }

  .hero {
    position: relative;
    isolation: isolate;
    margin-bottom: 26px;
  }

  .hero::before {
    content: "";
    position: absolute;
    z-index: -1;
    inset: -40px -56px;
    pointer-events: none;
    background: rgba(0, 0, 0, 0.46);
    -webkit-backdrop-filter: blur(10px) saturate(120%);
    backdrop-filter: blur(10px) saturate(120%);
    -webkit-mask-image: radial-gradient(closest-side, #000 55%, rgba(0, 0, 0, 0.55) 76%, transparent);
    mask-image: radial-gradient(closest-side, #000 55%, rgba(0, 0, 0, 0.55) 76%, transparent);
  }

  .eyebrow {
    margin: 0 0 12px;
    font: 600 10.5px/1 var(--mono);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--accent-dim);
  }

  .hero h1 {
    margin: 0;
    font-family: var(--display);
    font-size: clamp(28px, 4vw, 40px);
    line-height: 1.05;
    letter-spacing: -0.015em;
    font-weight: 400;
  }

  .notice { margin: 14px 0 0; max-width: 64ch; color: var(--muted); font-size: 13.5px; }

  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(158px, 1fr));
    gap: 12px;
    margin: 0 0 18px;
  }

  .stat {
    position: relative;
    overflow: hidden;
    padding: 15px 16px 14px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: linear-gradient(180deg, rgba(14, 21, 17, 0.86), rgba(5, 8, 7, 0.92));
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.035);
    transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .stat::before {
    content: "";
    position: absolute;
    inset: 0 auto 0 0;
    width: 2px;
    background: linear-gradient(180deg, var(--accent), transparent);
    opacity: 0.55;
  }

  .stat:hover {
    transform: translateY(-2px);
    border-color: var(--border-strong);
    box-shadow: 0 22px 44px -26px #000, inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  .stat dt {
    color: var(--faint);
    font: 600 10px/1.4 var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.13em;
  }

  .stat dd {
    margin: 6px 0 0;
    font: 600 21px/1.1 var(--mono);
    letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums;
  }

  .panel, .card {
    background: linear-gradient(180deg, var(--surface), rgba(4, 7, 6, 0.9));
    border: 1px solid var(--border);
    border-radius: 18px;
    backdrop-filter: blur(16px) saturate(130%);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04), 0 30px 70px -45px rgba(0, 0, 0, 0.95);
  }

  .panel { overflow: hidden; }

  .panel-head {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.012);
    flex-wrap: wrap;
  }

  .panel-head h2 { margin: 0; font: 400 14px/1.2 var(--display); letter-spacing: -0.01em; }

  .segmented {
    display: flex;
    gap: 3px;
    padding: 3px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.03);
  }

  .segmented button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 7px;
    cursor: pointer;
    transition: color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }

  .segmented button:hover { color: var(--text); }

  .segmented button[aria-pressed="true"] {
    background: var(--accent-soft);
    color: var(--accent);
    box-shadow: inset 0 0 0 1px rgba(142, 245, 197, 0.18), 0 0 18px -6px rgba(142, 245, 197, 0.25);
  }

  .ghost {
    margin-left: auto;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.02);
    color: var(--text);
    font: inherit;
    font-size: 13px;
    padding: 7px 12px;
    border-radius: 9px;
    cursor: pointer;
    transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }

  .ghost:hover {
    color: var(--accent);
    border-color: rgba(142, 245, 197, 0.3);
    background: rgba(142, 245, 197, 0.06);
    box-shadow: 0 0 20px -8px rgba(142, 245, 197, 0.35);
  }

  .panel-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  .panel-actions .ghost { margin-left: 0; }

  .live-status { color: var(--faint); font: 11.5px/1.4 var(--mono); }

  #live-toggle, #live-toggle[aria-pressed="true"] { display: inline-flex; align-items: center; gap: 7px; }

  #live-toggle::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--faint);
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }

  #live-toggle[aria-pressed="true"] {
    color: var(--ok);
    border-color: rgba(126, 240, 180, 0.3);
  }

  #live-toggle[aria-pressed="true"]::before {
    background: var(--ok);
    box-shadow: 0 0 10px var(--ok);
    animation: breathe 2.6s ease-in-out infinite;
  }

  button:focus-visible, a:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: 0.32; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.42; } }

  @media (prefers-reduced-motion: reduce) {
    .status.loading { animation: none; opacity: 0.7; }
    #live-toggle[aria-pressed="true"]::before { animation: none; }
    .asciify-fallback { transition: none; }
  }

  @media (max-width: 640px) {
    .segmented button, .ghost {
      min-height: 42px;
      padding: 10px 14px;
    }
  }

  .table-wrap { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }

  th {
    padding: 12px 16px;
    text-align: left;
    color: var(--faint);
    font: 600 10px/1.4 var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.13em;
    white-space: nowrap;
    background: rgba(255, 255, 255, 0.015);
    border-bottom: 1px solid var(--border);
  }

  td {
    padding: 12px 16px;
    text-align: left;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    vertical-align: top;
  }

  tbody tr { transition: background 0.15s ease; }
  tbody tr:hover { background: rgba(142, 245, 197, 0.04); }
  tbody tr:last-child td { border-bottom: 0; }

  td.numeric { font-variant-numeric: tabular-nums; white-space: nowrap; }
  td.summary { max-width: 360px; color: var(--muted); }

  .mono { font-family: var(--mono); font-size: 12.5px; }
  td.mono { color: var(--muted); }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 9px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: rgba(255, 255, 255, 0.05);
    color: var(--muted);
    font: 600 10.5px/1 var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  .badge::before {
    content: "";
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: currentColor;
  }

  .badge[data-tone="ok"] { color: var(--ok); background: rgba(126, 240, 180, 0.08); border-color: rgba(126, 240, 180, 0.18); }
  .badge[data-tone="warn"] { color: var(--warn); background: rgba(242, 198, 109, 0.08); border-color: rgba(242, 198, 109, 0.18); }
  .badge[data-tone="error"] { color: var(--error); background: rgba(255, 141, 128, 0.08); border-color: rgba(255, 141, 128, 0.18); }
  .badge[data-tone="info"] { color: var(--accent); background: rgba(142, 245, 197, 0.07); border-color: rgba(142, 245, 197, 0.16); }

  .link {
    border: 0;
    border-bottom: 1px solid rgba(142, 245, 197, 0.3);
    background: transparent;
    color: var(--accent);
    font: inherit;
    font-size: 13px;
    padding: 0 0 1px;
    cursor: pointer;
    text-decoration: none;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .link:hover { color: #c9ffe4; border-color: currentColor; }

  .status {
    padding: 22px 16px;
    color: var(--muted);
    font: 12.5px/1.6 var(--mono);
  }

  .status.loading { animation: pulse 1.6s ease-in-out infinite; }
  .status.error { color: var(--error); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }

  .empty { padding: 44px 16px; text-align: center; }
  .empty p { margin: 0; }
  .empty .hint { margin-top: 7px; color: var(--faint); font: 12.5px/1.6 var(--mono); }

  .stack { display: grid; gap: 14px; }
  .stack > * { min-width: 0; }
  .grid-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 14px; }

  .card { padding: 18px; }
  .card h2 { margin: 0 0 12px; font-family: var(--display); font-size: 15px; font-weight: 400; }
  .card h3 {
    margin: 0 0 14px;
    font: 600 10.5px/1.5 var(--mono);
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--faint);
  }

  .call-head { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
  .call-head h2 { margin: 0; font: 400 18px/1.3 var(--display); letter-spacing: -0.01em; }
  .call-head p { margin: 5px 0 0; color: var(--muted); font: 12.5px/1.6 var(--mono); }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; }

  dl.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin: 18px 0 0; }
  dl.meta div { min-width: 0; }
  dl.meta dt { color: var(--faint); font: 600 10px/1.4 var(--mono); text-transform: uppercase; letter-spacing: 0.13em; }
  dl.meta dd { margin: 4px 0 0; overflow-wrap: anywhere; font-size: 14px; }

  .resolved-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 12px; }
  .resolved-grid dt { color: var(--faint); font: 600 10px/1.4 var(--mono); text-transform: uppercase; letter-spacing: 0.13em; }
  .resolved-grid dd { margin: 4px 0 0; font: 600 17px/1.3 var(--mono); }
  .explanation { margin: 14px 0 0; color: var(--muted); font-size: 13px; }

  .timeline { list-style: none; margin: 0; padding: 0 0 0 14px; display: grid; gap: 10px; position: relative; }

  .timeline::before {
    content: "";
    position: absolute;
    left: 3px;
    top: 5px;
    bottom: 5px;
    width: 1px;
    background: linear-gradient(180deg, rgba(142, 245, 197, 0.24), rgba(255, 255, 255, 0.04));
  }

  .event {
    display: grid;
    grid-template-columns: 46px minmax(0, 1fr);
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-left: 2px solid rgba(255, 255, 255, 0.09);
    background: rgba(255, 255, 255, 0.018);
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .event:hover { background: rgba(142, 245, 197, 0.035); border-color: rgba(142, 245, 197, 0.14); }

  .event[data-kind="tool_call"], .event[data-kind="tool_result"] { border-left-color: var(--accent-dim); }
  .event[data-kind="error"] { border-left-color: var(--error); background: rgba(255, 141, 128, 0.05); }
  .event[data-kind="call_started"], .event[data-kind="call_ended"] { border-left-color: var(--ok); }

  .seq { font: 11px/1.5 var(--mono); color: var(--faint); }

  .event-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
  .event-head .type { font: 600 11px/1.4 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  .event-head code {
    font: 11.5px/1.4 var(--mono);
    color: var(--accent);
    background: rgba(142, 245, 197, 0.07);
    border: 1px solid rgba(142, 245, 197, 0.14);
    border-radius: 5px;
    padding: 1px 6px;
  }
  .latency { font: 10.5px/1.4 var(--mono); color: var(--faint); }

  .say { margin: 0; font-size: 13.5px; }
  .payload {
    margin: 0;
    padding: 9px 11px;
    max-height: 240px;
    overflow: auto;
    border-radius: 7px;
    border: 1px solid rgba(255, 255, 255, 0.05);
    background: rgba(0, 0, 0, 0.5);
    color: #9fb3a9;
    font: 12px/1.55 var(--mono);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
  }

  .back { margin-bottom: 14px; }

  footer {
    margin-top: 32px;
    padding-top: 18px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    color: var(--faint);
    font: 11px/1.6 var(--mono);
    letter-spacing: 0.04em;
  }

  @media (max-width: 760px) {
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-2 { grid-template-columns: minmax(0, 1fr); }
    td.summary { max-width: 220px; }
    .hero::before { inset: -28px -16px; }
  }
</style>
</head>
<body>
<div class="asciify-host" data-asciify-background data-asciify-state="loading" aria-hidden="true">
  <div class="asciify-fallback"></div>
</div>
<div class="veil" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="mark" aria-hidden="true">V</span>
    <span class="brand-text">VaaniKit</span>
  </div>
  <span class="pill"><span class="dot" aria-hidden="true"></span>non-production</span>
</header>

<main class="wrap">
  <header class="hero">
    <p class="eyebrow">Malayalam appointment line</p>
    <h1>Call operations</h1>
    <p class="notice">Synthetic demo data only. Phone numbers are masked in every response. This page is not production secure.</p>
  </header>

  <section id="dashboard">
    <dl class="stats" id="stats" aria-label="Clinic summary"></dl>

    <div class="panel">
      <div class="panel-head">
        <h2 id="list-title">Calls</h2>
        <div class="segmented" role="group" aria-label="Choose list">
          <button id="tab-calls" aria-pressed="true">Calls</button>
          <button id="tab-bookings" aria-pressed="false">Bookings</button>
        </div>
        <div class="panel-actions">
          <span class="live-status" id="live-status" role="status" aria-live="polite"></span>
          <button class="ghost" id="live-toggle" aria-pressed="true" title="Refresh automatically every 10 seconds">Live</button>
          <button class="ghost" id="refresh">Refresh</button>
        </div>
      </div>
      <div id="list-status" class="status" hidden></div>
      <div id="list-body"></div>
    </div>
  </section>

  <section id="detail" hidden>
    <button class="ghost back" id="back">← All calls</button>
    <div id="detail-status" class="status" hidden></div>
    <div id="detail-body"></div>
  </section>

  <footer>VaaniKit · synthetic clinic demo · JSON API at <span class="mono">/admin</span></footer>
</main>

<script>
(() => {
  const state = {
    status: null,
    calls: [],
    bookings: [],
    tab: "calls",
    live: true,
    loading: false,
    fingerprint: "",
    timer: null,
  };

  const dom = {
    dashboard: document.getElementById("dashboard"),
    detail: document.getElementById("detail"),
    stats: document.getElementById("stats"),
    listTitle: document.getElementById("list-title"),
    listStatus: document.getElementById("list-status"),
    listBody: document.getElementById("list-body"),
    detailStatus: document.getElementById("detail-status"),
    detailBody: document.getElementById("detail-body"),
    tabCalls: document.getElementById("tab-calls"),
    tabBookings: document.getElementById("tab-bookings"),
    refresh: document.getElementById("refresh"),
    liveStatus: document.getElementById("live-status"),
    liveToggle: document.getElementById("live-toggle"),
    back: document.getElementById("back"),
  };

  function el(tag, props = {}, ...children) {
    const node = document.createElement(tag);
    for (const [key, value] of Object.entries(props)) {
      if (value == null) continue;
      if (key === "class") node.className = value;
      else if (key === "text") node.textContent = value;
      else if (key === "dataset") Object.assign(node.dataset, value);
      else if (key.startsWith("on")) node.addEventListener(key.slice(2).toLowerCase(), value);
      else node.setAttribute(key, value);
    }
    for (const child of children.flat()) {
      if (child == null) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }

  async function getJSON(url) {
    const response = await fetch(url, { headers: { Accept: "application/json" } });
    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
    return response.json();
  }

  function formatDateTime(value) {
    if (!value) return "-";
    return new Date(value).toLocaleString("en-IN", {
      timeZone: "Asia/Kolkata",
      dateStyle: "medium",
      timeStyle: "short",
    }) + " IST";
  }

  function formatDuration(start, end) {
    if (!start || !end) return null;
    const seconds = Math.max(0, Math.round((new Date(end) - new Date(start)) / 1000));
    return seconds < 60 ? `${seconds}s` : `${Math.floor(seconds / 60)}m ${seconds % 60}s`;
  }

  function statusTone(status) {
    if (status === "completed") return "ok";
    if (status === "failed") return "error";
    if (status === "transferred") return "warn";
    return "info";
  }

  function badge(text, tone) {
    return el("span", { class: "badge", dataset: tone ? { tone } : {}, text: text || "none" });
  }

  function setStatus(node, message, kind) {
    if (!message) {
      node.hidden = true;
      node.replaceChildren();
      node.className = "status";
      return;
    }
    node.hidden = false;
    node.className = `status ${kind || ""}`.trim();
    node.replaceChildren(el("span", { text: message }));
  }

  function showError(node, error, retry, label) {
    setStatus(node, "", "");
    node.hidden = false;
    node.className = "status error";
    node.replaceChildren(
      el("span", { text: `${label} (${error.message}).` }),
      el("button", { class: "ghost", text: "Retry", onclick: retry, style: "margin-left:0" }),
    );
  }

  function emptyState(title, hint) {
    return el("div", { class: "empty" },
      el("p", { text: title }),
      el("p", { class: "hint", text: hint }),
    );
  }

  function renderStats() {
    const status = state.status;
    if (!status) { dom.stats.replaceChildren(); return; }
    const entries = [
      ["Calls", status.calls],
      ["Bookings", status.bookings],
      ["Calendars", status.calendars],
      ["Phone masking", status.phone_masking],
      ["Recordings", status.recordings],
    ];
    dom.stats.replaceChildren(...entries.map(([label, value]) =>
      el("div", { class: "stat" },
        el("dt", { text: label }),
        el("dd", { text: String(value) }),
      ),
    ));
  }

  function renderCalls() {
    if (!state.calls.length) {
      dom.listBody.replaceChildren(emptyState(
        "No calls yet.",
        "Run `make simulate SCENARIO=appointment-malayalam` to create one.",
      ));
      return;
    }

    const body = el("tbody", {}, ...state.calls.map((call) =>
      el("tr", {},
        el("td", { class: "numeric", text: formatDateTime(call.started_at) }),
        el("td", { class: "mono", text: call.caller_phone }),
        el("td", { text: call.language }),
        el("td", {}, badge(call.status, statusTone(call.status))),
        el("td", {}, call.outcome ? badge(call.outcome, "info") : el("span", { class: "muted", text: "-" })),
        el("td", { class: "numeric", text: call.booking_count ? String(call.booking_count) : "-" }),
        el("td", { class: "summary", text: call.summary || "-" }),
        el("td", {}, el("button", {
          class: "link",
          text: "View",
          dataset: { focusKey: `call-${call.id}` },
          onclick: () => showCall(call.id),
        })),
      ),
    ));

    dom.listBody.replaceChildren(el("div", { class: "table-wrap" },
      el("table", {},
        el("thead", {}, el("tr", {},
          ...["Started", "Caller", "Language", "Status", "Outcome", "Bookings", "Summary", ""]
            .map((label) => el("th", { text: label, scope: "col" })),
        )),
        body,
      ),
    ));
  }

  function renderBookings() {
    if (!state.bookings.length) {
      dom.listBody.replaceChildren(emptyState(
        "No bookings yet.",
        "Each simulation run books one open slot.",
      ));
      return;
    }

    const body = el("tbody", {}, ...state.bookings.map((booking) =>
      el("tr", {},
        el("td", { class: "numeric", text: formatDateTime(booking.slot_start) }),
        el("td", { text: booking.patient_name }),
        el("td", { class: "mono", text: booking.caller_phone }),
        el("td", { text: booking.clinic }),
        el("td", {}, badge(booking.status, booking.status === "confirmed" ? "ok" : "warn")),
        el("td", {}, booking.call_id
          ? el("button", {
              class: "link mono",
              text: booking.call_sid,
              dataset: { focusKey: `call-${booking.call_id}` },
              onclick: () => showCall(booking.call_id),
            })
          : el("span", { class: "muted", text: "-" })),
      ),
    ));

    dom.listBody.replaceChildren(el("div", { class: "table-wrap" },
      el("table", {},
        el("thead", {}, el("tr", {},
          ...["Slot", "Patient", "Caller", "Clinic", "Status", "Call"]
            .map((label) => el("th", { text: label, scope: "col" })),
        )),
        body,
      ),
    ));
  }

  function renderList({ preserveFocus = false } = {}) {
    const active = preserveFocus ? document.activeElement : null;
    const focusKey = active && dom.listBody.contains(active) ? active.dataset.focusKey : null;

    const calls = state.tab === "calls";
    dom.listTitle.textContent = calls ? "Calls" : "Bookings";
    dom.tabCalls.setAttribute("aria-pressed", String(calls));
    dom.tabBookings.setAttribute("aria-pressed", String(!calls));
    setStatus(dom.listStatus, "", "");
    if (calls) renderCalls(); else renderBookings();

    if (focusKey) {
      const target = dom.listBody.querySelector(`[data-focus-key="${focusKey}"]`);
      if (target) target.focus({ preventScroll: true });
    }
  }

  function updateLiveStatus(message) {
    dom.liveStatus.textContent = state.live ? message : "Live paused";
  }

  async function loadDashboard({ silent = false } = {}) {
    if (state.loading) return;
    state.loading = true;

    dom.dashboard.hidden = false;
    dom.detail.hidden = true;
    if (!silent) {
      renderStats();
      setStatus(dom.listStatus, "Loading calls and bookings…", "loading");
      dom.listBody.replaceChildren();
    }

    try {
      const [status, calls, bookings] = await Promise.all([
        getJSON("/admin/status"),
        getJSON("/admin/calls"),
        getJSON("/admin/bookings"),
      ]);
      const fingerprint = JSON.stringify([status, calls, bookings]);
      const changed = fingerprint !== state.fingerprint;
      state.status = status;
      state.calls = calls;
      state.bookings = bookings;
      state.fingerprint = fingerprint;

      if (changed || !silent) {
        renderStats();
        renderList({ preserveFocus: silent });
      }

      const updatedAt = new Date().toLocaleTimeString("en-IN", {
        timeZone: "Asia/Kolkata",
        hour12: false,
      });
      updateLiveStatus(`Updated ${updatedAt} IST`);
    } catch (error) {
      if (silent && state.status) {
        updateLiveStatus("Live update failed; showing last data");
      } else {
        dom.liveStatus.textContent = "";
        dom.listBody.replaceChildren();
        showError(dom.listStatus, error, () => loadDashboard(), "Could not load the admin data");
      }
    } finally {
      state.loading = false;
    }
  }

  function setLive(enabled) {
    state.live = enabled;
    dom.liveToggle.setAttribute("aria-pressed", String(enabled));
    if (enabled) {
      loadDashboard({ silent: true });
    } else {
      updateLiveStatus("");
    }
  }

  function scheduleLive() {
    clearInterval(state.timer);
    state.timer = setInterval(() => {
      if (!state.live || state.loading || document.hidden || dom.dashboard.hidden) return;
      loadDashboard({ silent: true });
    }, 10000);
  }

  function metaItem(label, value, mono) {
    return el("div", {},
      el("dt", { text: label }),
      el("dd", { class: mono ? "mono" : "", text: value || "-" }),
    );
  }

  function renderBookingCard(detail) {
    if (!detail.bookings.length) {
      return el("section", { class: "card" },
        el("h3", { text: "Bookings" }),
        el("p", { class: "muted", text: "This call did not create a booking." }),
      );
    }

    return el("section", { class: "card" },
      el("h3", { text: "Bookings" }),
      el("div", { class: "table-wrap" },
        el("table", {},
          el("thead", {}, el("tr", {},
            ...["Slot", "Patient", "Caller", "Status", "Reference"]
              .map((label) => el("th", { text: label, scope: "col" })),
          )),
          el("tbody", {}, ...detail.bookings.map((booking) =>
            el("tr", {},
              el("td", { class: "numeric", text: formatDateTime(booking.slot_start) }),
              el("td", { text: booking.patient_name }),
              el("td", { class: "mono", text: booking.caller_phone }),
              el("td", {}, badge(booking.status, booking.status === "confirmed" ? "ok" : "warn")),
              el("td", { class: "mono", text: `#${booking.id}` }),
            ),
          )),
        ),
      ),
    );
  }

  function renderEvent(event) {
    const text = typeof event.payload.text === "string" ? event.payload.text : null;
    return el("li", { class: "event", dataset: { kind: event.event_type } },
      el("span", { class: "seq", text: `#${event.seq}` }),
      el("div", {},
        el("div", { class: "event-head" },
          el("span", { class: "type", text: event.event_type.replaceAll("_", " ") }),
          event.tool_name ? el("code", { text: event.tool_name }) : null,
          event.latency_ms != null ? el("span", { class: "latency", text: `${event.latency_ms} ms` }) : null,
        ),
        text
          ? el("p", { class: "say", text })
          : el("pre", { class: "payload", text: JSON.stringify(event.payload, null, 2) }),
      ),
    );
  }

  function renderDetail(detail) {
    const duration = formatDuration(detail.started_at, detail.ended_at);
    const window = detail.ended_at
      ? `${formatDateTime(detail.started_at)} → ${formatDateTime(detail.ended_at)}${duration ? ` (${duration})` : ""}`
      : `Started ${formatDateTime(detail.started_at)} · in progress`;

    const resolved = detail.resolved
      ? el("section", { class: "card" },
          el("h3", { text: "Resolved date and time" }),
          el("dl", { class: "resolved-grid" },
            el("div", {}, el("dt", { text: "Date" }), el("dd", { text: detail.resolved.date || "-" })),
            el("div", {}, el("dt", { text: "Time" }), el("dd", { text: detail.resolved.time || "-" })),
            el("div", {}, el("dt", { text: "Time zone" }), el("dd", { text: detail.resolved.timezone })),
            el("div", {}, el("dt", { text: "Confidence" }), el("dd", { text: `${Math.round(detail.resolved.confidence * 100)}%` })),
          ),
          detail.resolved.explanation
            ? el("p", { class: "explanation", text: detail.resolved.explanation })
            : null,
        )
      : el("section", { class: "card" },
          el("h3", { text: "Resolved date and time" }),
          el("p", { class: "muted", text: "No date or time resolution was recorded for this call." }),
        );

    const errors = detail.events.filter((event) => event.event_type === "error").length;

    dom.detailBody.replaceChildren(
      el("div", { class: "stack" },
        el("article", { class: "card" },
          el("div", { class: "call-head" },
            el("div", {},
              el("h2", { text: detail.call_sid }),
              el("p", { text: window }),
            ),
            el("div", { class: "badges" },
              badge(detail.status, statusTone(detail.status)),
              detail.outcome ? badge(detail.outcome, "info") : null,
              errors ? badge(`${errors} error${errors > 1 ? "s" : ""}`, "error") : null,
            ),
          ),
          el("dl", { class: "meta" },
            metaItem("Caller", detail.caller_phone, true),
            metaItem("Language", detail.language),
            metaItem("Channel", detail.channel),
            metaItem("Bookings", String(detail.booking_count)),
          ),
        ),
        el("div", { class: "grid-2" },
          resolved,
          el("section", { class: "card" },
            el("h3", { text: "Summary" }),
            el("p", { text: detail.summary || "No summary recorded for this call." }),
          ),
        ),
        renderBookingCard(detail),
        el("section", { class: "card" },
          el("h3", { text: `Events (${detail.events.length})` }),
          detail.events.length
            ? el("ol", { class: "timeline" }, ...detail.events.map(renderEvent))
            : el("p", { class: "muted", text: "No events recorded." }),
        ),
      ),
    );
  }

  async function openCall(id) {
    dom.dashboard.hidden = true;
    dom.detail.hidden = false;
    dom.detailBody.replaceChildren();
    document.title = `Call #${id} · VaaniKit admin`;
    setStatus(dom.detailStatus, `Loading call #${id}…`, "loading");

    try {
      const detail = await getJSON(`/admin/calls/${id}`);
      setStatus(dom.detailStatus, "", "");
      renderDetail(detail);
      document.title = `${detail.call_sid} · VaaniKit admin`;
    } catch (error) {
      showError(dom.detailStatus, error, () => openCall(id), `Could not load call #${id}`);
    }
  }

  function showCall(id) {
    const hash = `#call-${id}`;
    if (location.hash === hash) openCall(id);
    else location.hash = hash;
  }

  function route() {
    const match = location.hash.match(/^#call-(\d+)$/);
    if (match) {
      openCall(Number(match[1]));
    } else {
      document.title = "VaaniKit admin";
      loadDashboard();
    }
  }

  function selectTab(tab) {
    state.tab = tab;
    renderList();
  }

  dom.tabCalls.addEventListener("click", () => selectTab("calls"));
  dom.tabBookings.addEventListener("click", () => selectTab("bookings"));
  dom.refresh.addEventListener("click", route);
  dom.liveToggle.addEventListener("click", () => setLive(!state.live));
  dom.back.addEventListener("click", () => { location.hash = ""; });
  window.addEventListener("hashchange", route);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && state.live && !dom.dashboard.hidden) {
      loadDashboard({ silent: true });
    }
  });

  scheduleLive();
  route();
})();
</script>
<script src="/admin/static/asciify.bundle.js" defer></script>
</body>
</html>
