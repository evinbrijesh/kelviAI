agent:
  name: "kelviai-demo"
  language: "ml-IN"
  greeting: "നമസ്കാരം! നിലാ ഫാമിലി ക്ലിനിക്കിൽ നിന്നുള്ള കേൾവി AI അസിസ്റ്റന്റ് ആണ്. ഡോക്ടറെ കാണാനുള്ള അപ്പോയിന്റ്മെന്റുകൾ പരിശോധിക്കാനും ബുക്ക് ചെയ്യാനും സഹായിക്കാം. എങ്ങനെ സഹായിക്കണം?"
  persona: "Helpful medical appointment assistant"
  rules:
    - "Always confirm date and time before booking"
    - "Ask for caller name before booking"
    - "Repeat booking details for confirmation"
    - "Transfer to human if request is unclear"

model:
  provider: "gnani"
  stt:
    model: "prisma-v3.0"
    language: "indic-auto"
  tts:
    model: "timbre-v2.5"
    voice: "Reshma"
    voices:
      bn-IN: "Kirra"
      en-IN: "Kaveri"
      gu-IN: "Falak"
      hi-IN: "Nalini"
      kn-IN: "Saanvi"
      ml-IN: "Reshma"
      mr-IN: "Zahira"
      pa-IN: "Mehuli"
      ta-IN: "Asmita"
      te-IN: "Suhana"
  date_time_resolver: "evon"

tools:
  - name: "check_availability"
    description: "Check available appointment slots"
    enabled: true
    parameters:
      type: "object"
      properties:
        date:
          type: "string"
          description: "Target date in YYYY-MM-DD format"
        time_slot:
          type: "string"
          description: "Optional preferred time slot (e.g. morning, afternoon, evening)"
      required: ["date"]
  - name: "book_slot"
    description: "Book an appointment slot"
    enabled: true
    parameters:
      type: "object"
      properties:
        caller_name:
          type: "string"
          description: "Name of the caller"
        date:
          type: "string"
          description: "Date of appointment in YYYY-MM-DD format"
        time:
          type: "string"
          description: "Time of appointment in HH:MM format"
      required: ["caller_name", "date", "time"]
  - name: "cancel_booking"
    description: "Cancel an existing booking"
    enabled: true
    parameters:
      type: "object"
      properties:
        booking_id:
          type: "string"
          description: "Unique booking reference ID"
      required: ["booking_id"]
  - name: "reschedule_booking"
    description: "Reschedule an existing booking to a new date and time"
    enabled: true
    parameters:
      type: "object"
      properties:
        booking_id:
          type: "string"
          description: "Unique booking reference ID"
        date:
          type: "string"
          description: "New date of appointment in YYYY-MM-DD format"
        time_slot:
          type: "string"
          description: "New time of appointment in HH:MM format"
      required: ["booking_id", "date", "time_slot"]
  - name: "transfer_to_human"
    description: "Transfer call to human agent"
    enabled: true
    parameters:
      type: "object"
      properties:
        reason:
          type: "string"
          description: "Reason for transferring to a human operator"
      required: ["reason"]

gnani:
  api_key_id: "${GNAI_API_KEY_ID}"
  base_url: "https://api.vachana.ai"

database:
  url: "${DATABASE_URL}"
