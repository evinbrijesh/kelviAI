agent:
  name: "vaanikit-demo"
  language: "malayalam"
  greeting: "നമസ്കാരം, ഞാൻ വാണികിറ്റ് അസിസ്റ്റന്റ് ആണ്. എങ്ങനെ സഹായിക്കാം?"
  persona: "Helpful medical appointment assistant"
  rules:
    - "Always confirm date and time before booking"
    - "Ask for caller name before booking"
    - "Repeat booking details for confirmation"
    - "Transfer to human if request is unclear"

model:
  provider: "gnani"
  stt:
    model: "prisma-v3.0"
    language: "ml-IN"
  tts:
    model: "timbre-v2.5"
    voice: "Reshma"
  date_time_resolver: "custom"

tools:
  - name: "check_availability"
    description: "Check available appointment slots"
    enabled: true
    parameters:
      type: "object"
      properties:
        date:
          type: "string"
          description: "Target date in YYYY-MM-DD format"
        time_slot:
          type: "string"
          description: "Optional preferred time slot (e.g. morning, afternoon, evening)"
      required: ["date"]
  - name: "book_slot"
    description: "Book an appointment slot"
    enabled: true
    parameters:
      type: "object"
      properties:
        caller_name:
          type: "string"
          description: "Name of the caller"
        date:
          type: "string"
          description: "Date of appointment in YYYY-MM-DD format"
        time:
          type: "string"
          description: "Time of appointment in HH:MM format"
      required: ["caller_name", "date", "time"]
  - name: "cancel_booking"
    description: "Cancel an existing booking"
    enabled: true
    parameters:
      type: "object"
      properties:
        booking_id:
          type: "string"
          description: "Unique booking reference ID"
      required: ["booking_id"]
  - name: "transfer_to_human"
    description: "Transfer call to human agent"
    enabled: true
    parameters:
      type: "object"
      properties:
        reason:
          type: "string"
          description: "Reason for transferring to a human operator"
      required: ["reason"]

gnani:
  api_key_id: "${GNAI_API_KEY_ID}"
  base_url: "https://api.vachana.ai"

database:
  url: "${DATABASE_URL}"
