services:
  db:
    image: postgres:16-alpine
    container_name: vaanikit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vaanikit
      POSTGRES_PASSWORD: vaanikit
      POSTGRES_DB: vaanikit
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaanikit -d vaanikit"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: vaanikit_app
    restart: unless-stopped
    ports:
      - "${APP_HOST_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://vaanikit:vaanikit@db:5432/vaanikit
      GNAI_API_KEY_ID: ${GNAI_API_KEY_ID:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
